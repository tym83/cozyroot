# Injected by the platform from the cozystack-values Secret. The empty
# default keeps the chart renderable on its own, outside a cluster.
_cluster: {}
console:
  # Both dashboard Deployments carry a preferred pod anti-affinity on
  # kubernetes.io/hostname, which only spreads anything once more than one
  # replica exists. The count was pinned at 1 in the template, so a single
  # node failure took the dashboard with it; it is a value now, and two is
  # the default on a multi-node cluster.
  replicas: 2
  image: ghcr.io/tym83/cozyroot/cozystack-ui:v1.7.0-alpha.13@sha256:afc55ed2fa3a91e286b7db28698ae51ab60350799a81e7e40838a99601965a89
gatekeeper:
  replicas: 2
tokenProxy:
