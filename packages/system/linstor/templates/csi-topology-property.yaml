{{- if and .Values.externalController.enabled .Values.externalController.nodeTopologyProperty.enabled }}
{{- /* Give every blockstor node the `Aux/topology/*` property the operator
       compares the CSI driver's kubelet registration against.

       reconcileCSINodes in piraeus-operator reads the topology keys the driver
       registered and the keys of the node's `Aux/topology/*` properties, and
       when the two sets differ it deletes the driver's CSINode entry and the
       csi-node pod so the driver registers again. The driver always registers
       `linbit.com/hostname`, and in this mode nothing writes a matching
       property: piraeus writes those from LinstorSatelliteConfiguration, which
       has no satellites to apply here, and the driver only reads topologies.
       The sets therefore never match, and the pods are recreated roughly every
       two seconds for as long as the mode is on -- with nothing reporting an
       error, because LinstorCluster only reaches `Configured=Unknown`.

       Only the keys are compared, never the values, so the node's own name is
       as good a value as any and makes the property legible on the object.

       This belongs in blockstor, which owns the nodes: see the comment in
       cluster.yaml. Until it sets the property itself, this keeps the CSI
       driver registered. Drop the whole file, its values block and its tests
       when blockstor does, and the operator will not notice the difference. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linstor-csi-topology-property
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linstor-csi-topology-property
rules:
  {{- /* Nodes are cluster-scoped, so this cannot be a namespaced Role. It is
         the narrowest grant that does the job: no create, no delete, and the
         property is written with a merge patch rather than a full update. */}}
  - apiGroups: ["blockstor.cozystack.io"]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linstor-csi-topology-property
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linstor-csi-topology-property
subjects:
  - kind: ServiceAccount
    name: linstor-csi-topology-property
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linstor-csi-topology-property
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.externalController.nodeTopologyProperty.schedule | quote }}
  {{- /* A run that outlives its schedule would stack up behind the next one,
         and two of them patching the same nodes is pointless rather than
         harmful. Forbid overlap and let a missed tick be missed: the next one
         is a minute away and the property does not expire. */}}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linstor-csi-topology-property
        spec:
          serviceAccountName: linstor-csi-topology-property
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # clastix/kubectl's image user is the non-numeric name `nonroot`,
            # which the kubelet cannot verify against runAsNonRoot; pin a
            # numeric UID so the Pod passes admission (same value as the
            # etcd-operator hook running this image).
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: patch
              image: {{ printf "%s:%s" .Values.kubectlImage.repository .Values.kubectlImage.tag }}{{ with .Values.kubectlImage.digest }}@{{ . }}{{ end }}
              imagePullPolicy: {{ .Values.kubectlImage.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  key='Aux/topology/linbit.com/hostname'
                  # Every node is patched unconditionally: a merge patch that
                  # writes the value already there is a no-op down to the
                  # resourceVersion, so this cannot become the reconcile churn
                  # it exists to stop. Reading first to decide would need a
                  # jsonpath filter on a key that may be absent, which is the
                  # one thing jsonpath handles badly.
                  for node in $(kubectl get nodes.blockstor.cozystack.io \
                      -o jsonpath='{range .items[*]}{.metadata.name} {end}'); do
                    kubectl patch nodes.blockstor.cozystack.io "$node" --type merge \
                      -p "{\"spec\":{\"props\":{\"$key\":\"$node\"}}}"
                  done
              {{- /* kubectl writes its cache and config under $HOME, which the
                     read-only root filesystem refuses. */}}
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
