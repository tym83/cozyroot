migrationController:
  image: "ghcr.io/cozystack/cozystack/migration-controller:latest"
  # Where this controller may run. The platform threads these through
  # spec.components.<name>.values of the Package, so a cluster can put the
  # component on named nodes without the chart being edited in place.
  # The tolerations are the chart's former hard-coded pair: a controller has to
  # keep running on a cluster whose only schedulable nodes are control-plane
  # ones. Replacing the list drops them, which is the point of it being a value.
  nodeSelector: {}
  affinity: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  replicas: 1
  debug: false
  metrics:
    enabled: true
    bindAddress: ":8443"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

## The VMware Virtual Disk Development Kit image, delivered from the platform.
## Never a tenant value: naming an image the cluster will run is not a tenant's
## decision, and this one is built from a proprietary SDK that Cozystack can
## neither ship nor mirror. An operator holding a VDDK licence builds it, pushes
## it somewhere the cluster can pull from, and sets `vmImport.vddkImage` in the
## platform values, which the iaas bundle forwards into this chart.
## Empty is the normal state and means the vSphere import path is unavailable
## rather than broken: a vSphere VMImportSource reports it on its own status.
vddkImage: ""
