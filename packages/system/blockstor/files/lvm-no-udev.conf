# LVM configuration for a host that runs no udev.
#
# LVM does not create the device nodes it then opens: it asks the kernel to
# make the mapping and waits for udev to publish /dev/<vg>/<lv> and the entry
# under /dev/mapper. On a host with a minimal userspace there is no udev, the
# node never appears, and lvcreate fails at the step where it wipes the start
# of the new volume:
#
#   /dev/data/lvol0: not found: device not cleared
#   Aborting. Failed to wipe start of new LV.
#
# Worse, the half-made state is not cleaned up either: the kernel mapping and
# the stale node outlive the failure, hold the disk, and make the next attempt
# fail differently -- pvcreate cannot open the device, then vgcreate refuses
# because /dev/<vg> already exists. The retry loop never converges.
#
# These four settings make LVM do the work itself instead of waiting for
# something that will never come.
devices {
    # Scan /dev rather than asking udev for the device list.
    obtain_device_list_from_udev = 0
}
activation {
    # Do not wait for udev to acknowledge an operation.
    udev_sync = 0
    # Do not expect udev rules to create the nodes; create them directly.
    udev_rules = 0
    # Do not check that udev did what it was asked -- it was not asked.
    verify_udev_operations = 0
}
