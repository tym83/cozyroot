{{- /*
Two reconcilers without a lease both drive the same DRBD layer: they would
race on resource placement and on the finalizers that tear volumes down, and
the damage lands on the disks rather than on the API. Refuse the combination
at render time instead of shipping it.
*/}}
{{- if and (gt (int .Values.controller.replicas) 1) (not .Values.controller.leaderElect) }}
{{- fail "controller.replicas > 1 requires controller.leaderElect: true -- without the lease every replica reconciles, and two reconcilers racing on the same DRBD resources corrupt placement" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockstor-controller
  namespace: {{ .Release.Namespace }}
---
{{- /*
Cluster-wide read on the core API plus full write on the blockstor group. The
reconcilers watch nothing outside that group, so the verb set stays narrow.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blockstor-controller
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blockstor.cozystack.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blockstor.cozystack.io]
    resources: ["*/status", "*/finalizers"]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blockstor-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blockstor-controller
subjects:
  - kind: ServiceAccount
    name: blockstor-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockstor-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: blockstor-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: blockstor-controller
  template:
    metadata:
      labels:
        app: blockstor-controller
    spec:
      serviceAccountName: blockstor-controller
      {{- /*
      The REST layer's graceful-shutdown window is derived from its rollback
      budget, and this has to outlive it or a SIGTERM kills a compensation
      mid-cascade.
      */}}
      terminationGracePeriodSeconds: 21
      {{- if gt (int .Values.controller.replicas) 1 }}
      {{- /*
      Only one replica reconciles, so the point of the second is surviving the
      loss of the node holding the lease. Two on one node survive nothing.
      Preferred rather than required so a two-node cluster still schedules both.
      */}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: blockstor-controller
      {{- end }}
      containers:
        - name: manager
          image: {{ .Values.images.registry }}/blockstor-controller:{{ .Values.images.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            {{- /* The REST surface is the separate apiserver Deployment; this process only runs reconcilers. */}}
            - --enable-rest-api=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --leader-elect={{ .Values.controller.leaderElect }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
