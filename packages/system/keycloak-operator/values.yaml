    tag: "v1.7.0-alpha.13@sha256:f6bd24d294fd77bef84112a9f3141dd3a96f5035eead345a0c33da841684dd45"
  clusterReconciliationEnabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
