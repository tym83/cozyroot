    # The host stays inside `repository`: the nightly mirror's host rewrite
    # cannot reach a build registry whose `registry` key holds only part of it.
    registry: ""
    repository: ghcr.io/tym83/cozyroot/keycloak-operator
    tag: "v1.7.0-alpha.12@sha256:cea2ff98718a0acdf4ed5861111779def9a151382cdec51472c5df599bf695a0"
  clusterReconciliationEnabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
