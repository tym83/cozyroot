apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozystack-controller
  labels:
    app: cozystack-controller
spec:
  replicas: {{ .Values.cozystackController.replicas }}
  selector:
    matchLabels:
      app: cozystack-controller
  template:
    metadata:
      labels:
        app: cozystack-controller
    spec:
      # A standby on the same node as the leader is lost with it, which is the
      # failure the second replica exists for. Preferred rather than required:
      # a single-node cluster still places both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: cozystack-controller
              topologyKey: kubernetes.io/hostname
      serviceAccountName: cozystack-controller
      containers:
      - name: cozystack-controller
        image: "{{ .Values.cozystackController.image }}"
        args:
        - --leader-elect
        {{- if .Values.cozystackController.debug }}
        - --zap-log-level=debug
        {{- else }}
        - --zap-log-level=info
        {{- end }}
        {{- if .Values.cozystackController.disableTelemetry }}
        - --disable-telemetry
        {{- end }}
        {{- with .Values.cozystackController.seaweedfsMetricsEndpoint }}
        - --seaweedfs-metrics-endpoint={{ . }}
        {{- end }}
        {{- with .Values.cozystackController.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
