cozystackController:
  image: ghcr.io/tym83/cozyroot/cozystack-controller:v1.7.0-alpha.12@sha256:e4133c6dca125b9503b78eb3633ceccd687b0590cca86c5aa851d27a9c3aaf91
  debug: false
  disableTelemetry: false
  # Base URL of a Prometheus-compatible query API to fetch SeaweedFS bucket
  # size metrics from, for deployments where SeaweedFS and the monitoring
  # stack that scrapes it run in a separate cluster. Empty keeps discovery
  # via the namespace.cozystack.io/monitoring label.
  seaweedfsMetricsEndpoint: ""
  # A standby, not a second writer: the chart always passes --leader-elect, so
  # exactly one manager holds the Lease and runs the reconcilers. Two is the
  # default because one replica makes the Lease pointless — losing the node
  # that ran it stops every reconciler until the pod is placed again, and the
  # pods are kept apart (see the anti-affinity in the Deployment) so the
  # standby does not share the node it stands by for.
  replicas: 2
  # Empty by default: no resources block is rendered, so requests and limits are
  # opt-in. Idle usage (measured) is ~69Mi — keep a limit above that.
  resources: {}
