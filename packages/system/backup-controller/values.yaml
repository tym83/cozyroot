backupController:
  image: "ghcr.io/tym83/cozyroot/backup-controller:v1.7.0-alpha.13@sha256:722f1ac994256270f702ca8eacde64bd52d01cfdde8077fe6684cdbfa76980e5"
  # Where this controller may run. The platform threads these through
  # spec.components.<name>.values of the Package, so a cluster can put the
  # component on named nodes without the chart being edited in place.
  # The tolerations are the chart's former hard-coded pair: a controller has to
  # keep running on a cluster whose only schedulable nodes are control-plane
  # ones. Replacing the list drops them, which is the point of it being a value.
  nodeSelector: {}
  affinity: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  replicas: 2
  debug: false
  metrics:
    enabled: true
    bindAddress: ":8443"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
