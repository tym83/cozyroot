redis-operator:
  image:
    repository: ghcr.io/tym83/cozyroot/redis-operator
    tag: v1.7.0-alpha.13@sha256:03242aed69c46ca999ff09c2d6f170fbbb437d0c8dba65f95989ba280b6d188f
  # The freshworks-oss fork requires a non-empty operator group id at startup
  # (fatal "operator_group_id environment variable is required" otherwise); the
  # archived spotahome operator had no such knob. A single cluster-wide operator
  # only needs a stable non-empty value, so pin it rather than leave it unset.
  extraEnvVars:
    - name: OPERATOR_GROUP_ID
      value: "cozystack"
