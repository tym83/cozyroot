apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
rules:
- apiGroups:
  - ""
  resources:
  - services
  resourceNames:
  - {{ include "virtual-machine.fullname" . }}
  verbs: ["get", "list", "watch"]
- apiGroups:
  - cozystack.io
  resources:
  - workloadmonitors
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-resources
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
---
{{- /*
A halted machine has no pod, so a monitor that still expects one never
reports ready: the release then waits out its whole timeout and settles as
not ready, which makes stopping a machine through its own chart impossible.
What is expected has to follow what was asked for.
*/}}
{{- $expected := ternary 0 1 (eq (include "virtual-machine.runStrategy" .) "Halted") }}
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $expected }}
  minReplicas: {{ $expected }}
  kind: virtual-machine
  type: virtual-machine
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  version: {{ $.Chart.Version }}
